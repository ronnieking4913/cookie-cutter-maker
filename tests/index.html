<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie Cutter Tests</title>
<!-- the app's stylesheet, for the layout tests -->
<link rel="stylesheet" href="../styles.css">
<style>
  :root { --bg: #f2f3ef; --ink: #23211f; --muted: #6d6a64; --pass: #1f7a4a; --fail: #b8334a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161715; --ink: #ecebe6; --muted: #9d9a92; --pass: #5fcf8e; --fail: #ec6b80; color-scheme: dark; } }
  html, body { height: auto; }
  body { display: block; background: var(--bg); color: var(--ink); font: 15px/1.6 "Segoe UI", system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  #summary { font-weight: 600; font-size: 18px; margin: 0 0 16px; }
  #results { list-style: none; padding: 0; margin: 0; font-family: Consolas, monospace; font-size: 14px; }
  #results li { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
  #results li::after { content: attr(data-ms); color: var(--muted); white-space: nowrap; }
  .pass { color: var(--pass); } .fail { color: var(--fail); }
  /* layout tests build pieces of the page here, off-screen */
  #sandbox { position: absolute; left: -10000px; top: 0; width: 1200px; }
</style>
</head>
<body>
<h1>Cookie Cutter Maker tests</h1>
<p id="summary">Running…</p>
<ul id="results"></ul>
<div id="sandbox" aria-hidden="true"></div>

<!-- the app's code -->
<script src="../js/background.js"></script>
<script src="../js/shape.js"></script>
<script src="../js/cutter.js"></script>
<script src="../js/stamp.js"></script>
<script src="../js/stl.js"></script>
<script src="../js/preview.js"></script>
<!-- the tests -->
<script src="runner.js"></script>
<script src="background.test.js"></script>
<script src="editing.test.js"></script>
<script src="cutter.test.js"></script>
<script src="stamp.test.js"></script>
<script src="layout.test.js"></script>
<script>T.run();</script>
</body>
</html>
